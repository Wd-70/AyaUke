<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 380px; margin: 0; font-family: system-ui, sans-serif; font-size: 13px; color: #1a1a1a; }
    header { padding: 10px 12px; background: #111; color: #fff; font-weight: 700; }
    .bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1px solid #eee; }
    button { padding: 6px 10px; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
    #scan { background: #e7e7ef; }
    #dump { background: #ffe9c7; }
    #ingest { background: #6c5ce7; color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    #status { padding: 8px 12px; color: #555; white-space: pre-wrap; }
    #list { max-height: 380px; overflow-y: auto; padding: 0 12px 12px; }
    .cand { border: 1px solid #eee; border-radius: 8px; padding: 8px; margin-bottom: 8px; }
    .cand label { display: flex; align-items: center; gap: 6px; font-weight: 600; }
    .thumbs { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    .thumbs img { width: 72px; height: 72px; object-fit: cover; border-radius: 4px; background: #f2f2f2; }
    .src { font-size: 11px; color: #888; word-break: break-all; margin-top: 4px; }
    .hint { padding: 0 12px 10px; font-size: 11px; color: #999; }
  </style>
</head>
<body>
  <header>방종셀카 수집기 · 카페</header>
  <div class="bar">
    <button id="scan">본문 스캔</button>
    <button id="dump">개발용 덤프</button>
    <button id="ingest" disabled>선택 수집</button>
  </div>
  <div id="status">네이버 카페 셀카 글에서 '본문 스캔' 또는 '개발용 덤프'를 누르세요.</div>
  <div class="hint">덤프는 로컬 서버(localhost:3000, 관리자 로그인)로 보내 <code>selfie-archive/_debug/</code>에 저장됩니다.</div>
  <div id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
