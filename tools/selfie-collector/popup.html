<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 360px; margin: 0; font-family: system-ui, sans-serif; font-size: 13px; color: #1a1a1a; }
    header { padding: 10px 12px; background: #111; color: #fff; font-weight: 700; }
    .bar { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #eee; }
    button { padding: 6px 12px; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
    #scan { background: #e7e7ef; }
    #ingest { background: #6c5ce7; color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    #status { padding: 8px 12px; color: #555; }
    #list { max-height: 420px; overflow-y: auto; padding: 0 12px 12px; }
    .cand { border: 1px solid #eee; border-radius: 8px; padding: 8px; margin-bottom: 8px; }
    .cand label { display: flex; align-items: center; gap: 6px; font-weight: 600; }
    .thumbs { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    .thumbs img { width: 72px; height: 72px; object-fit: cover; border-radius: 4px; background: #f2f2f2; }
    .src { font-size: 11px; color: #888; word-break: break-all; margin-top: 4px; }
  </style>
</head>
<body>
  <header>방종셀카 수집기</header>
  <div class="bar">
    <button id="scan">현재 페이지 스캔</button>
    <button id="ingest" disabled>선택 수집</button>
  </div>
  <div id="status">X 게시물/프로필 또는 카페 글에서 '현재 페이지 스캔'을 누르세요.</div>
  <div id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
